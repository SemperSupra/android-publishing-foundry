name: R44 Responsive Presentation Contract
on:
  pull_request:
    paths:
      - 'prototype/presentation-adapter.mjs'
      - 'prototype/presentation-adapter.test.mjs'
      - '.github/workflows/r44-responsive-presentation.yml'
permissions:
  contents: read
jobs:
  responsive:
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm, windows-2025]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Browser-projection, accessibility and no-permission oracles
        run: |
          node --version
          node --test prototype/presentation-adapter.test.mjs
          node --test prototype/human-io-capability.test.mjs
